services:
  steam-wayland:
    image: ghcr.io/remominor/steam-wayland:latest
    container_name: steam-wayland
    runtime: nvidia
    network_mode: host
    ipc: private
    shm_size: 2gb
    ulimits:
      memlock: -1
      rtprio: 95
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
      - MKNOD
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/Los_Angeles}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-GPU-cd07fae4-7ed4-c80d-f4df-ec3b5642261e,GPU-21fdd467-e589-a334-cd13-5eaceebec5a4}
      NVIDIA_DRIVER_CAPABILITIES: all
      DRI_NODE: /dev/dri/renderD128
      WLR_RENDERER: ${WLR_RENDERER:-auto}
      WLR_LIBINPUT_NO_DEVICES: ${WLR_LIBINPUT_NO_DEVICES:-1}
      XDG_SEAT: ${XDG_SEAT:-seat0}
      DEFAULT_MODE: ${DEFAULT_MODE:-1920x1080@60}
      OUTPUT_MODE_POLICY: ${OUTPUT_MODE_POLICY:-fixed}
      SUNSHINE_CSRF_ALLOWED_ORIGINS: ${SUNSHINE_CSRF_ALLOWED_ORIGINS:-}
      ENABLE_FLATPAK: ${ENABLE_FLATPAK:-false}
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input
      - /dev/uinput:/dev/uinput
      - /dev/fuse:/dev/fuse
    device_cgroup_rules:
      - "c 13:* rmw"
    volumes:
      - /mnt/cache_nvme/appdata/steam-wayland:/config
      - /mnt/user/games_nvme:/mnt/games
      - /run/udev:/run/udev:ro
    restart: unless-stopped
